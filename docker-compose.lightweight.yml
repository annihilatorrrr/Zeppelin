name: zeppelin-lightweight

services:
  migrate:
    build: &build
      context: .
    environment: &env
      - NODE_ENV=production
      - DB_HOST=${LIGHTWEIGHT_DB_HOST}
      - DB_PORT=${LIGHTWEIGHT_DB_PORT}
      - DB_USER=${LIGHTWEIGHT_DB_USER}
      - DB_PASSWORD=${LIGHTWEIGHT_DB_PASSWORD}
      - DB_DATABASE=${LIGHTWEIGHT_DB_DATABASE}
      - API_PATH_PREFIX=${LIGHTWEIGHT_API_PATH_PREFIX}
    env_file:
      - .env
    command: ["migrate"]

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
    build: *build
    restart: on-failure
    environment: *env
    env_file:
      - .env
    ports:
      - "${LIGHTWEIGHT_API_PORT}:3001"
    command: ["api"]

  bot:
    depends_on:
      migrate:
        condition: service_completed_successfully
    build: *build
    restart: on-failure
    environment: *env
    env_file:
      - .env
    command: ["bot"]
  
  dashboard:
    build: *build
    restart: on-failure
    environment: *env
    env_file:
      - .env
    ports:
      - "${LIGHTWEIGHT_DASHBOARD_PORT}:3002"
    command: ["dashboard"]
